<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Formulario de inscripción de LUMVEA." />
  <title>Inscripción | LUMVEA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">L</span><span>LUMVEA</span></a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav"><span class="sr-only">Abrir menú</span><span aria-hidden="true">Menú</span></button>
    <nav id="site-nav" class="site-nav" aria-label="Navegación principal"></nav>
  </header>
  <main>
    <section id="inscripción" class="enrollment section">
      <div class="enrollment-copy">
        <p class="eyebrow">INSCRIPCIONES ABIERTAS</p>
        <h1>Da el primer paso hacia tu próxima meta.</h1>
        <p>Completa tus datos y te enviaremos información sobre el nivel, cursos, horarios y paquetes que necesitas.</p>
      </div>
      <form id="interest-form" class="interest-form" novalidate>
        <div class="form-row"><label for="name">Nombre completo</label><input id="name" name="name" type="text" required /></div>
        <div class="form-row"><label for="phone">Celular</label><input id="phone" name="phone" type="tel" required /></div>
        <div class="form-row"><label for="program">Programa de interés</label><select id="program" name="program"><option value="">Selecciona una opción</option></select></div>
        <button class="button button-primary" type="submit">Continuar por WhatsApp</button>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">L</span><span>LUMVEA</span></a><p>Educación virtual para primaria, secundaria y preuniversitaria.</p><p>&copy; <span id="year"></span> LUMVEA Educación</p></footer>
  <script src="script.js"></script>
</body>
</html>
